[package]
name = "sbg-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
embedded-hal = "0.2.7"
nb = "1.0.0"
defmt = "0.3.2"
cortex-m = { workspace = true }
serde = { workspace = true }

cortex-m-rt = "^0.7.0"
messages-prost = { workspace = true }
common-arm = { path = "../../crates/common-arm" }
heapless = "0.7.16"
bitflags = { version = "2.4.2", features = ["serde"] }

[build-dependencies]
cmake = "0.1"

[package.metadata]
# Silence all warnings due to a large portion of the autogenerated 
# bindings being consisted of unused imports and unreachable patterns.
# These warnings are not actionable and would
# otherwise obscure real issues during development.
rustflags = ["-Awarnings"]
